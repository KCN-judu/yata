[workspace]
resolver = "3"
members = ["crates/yata-core", "crates/yata-protocol", "crates/yata-store", "crates/yata-daemon"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KCN-judu/yata"

[workspace.dependencies]
# internal crates by path, then external crates pinned to a minor version
yata-core = { path = "crates/yata-core" }
yata-protocol = { path = "crates/yata-protocol" }
yata-store = { path = "crates/yata-store" }
base64 = "0.23"
getrandom = "0.4"
# the named pipe with a security descriptor, on Windows only (ADR-0006)
miniz_oxide = "0.9"
png = "0.18"
proptest = "1.11"
qrcodegen = "1.8"
# QR reading only: the image stack stays out, and the daemon decodes PNG itself
rqrr = { version = "0.11", default-features = false }
pbjson = "0.9"
pbjson-build = "0.9"
prost = "0.14"
prost-build = "0.14"
prost-types = "0.14"
protox = "0.9"
serde = "1.0"
serde_json = "1.0"
sha2 = "0.11"
# SQLite built in, so every platform runs the same version (ADR-0019)
rusqlite = { version = "0.40", features = ["bundled"] }
# the blob codec (fact-format.md, Blobs and content addressing)
zstd = { version = "0.14", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
