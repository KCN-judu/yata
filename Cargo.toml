[workspace]
resolver = "3"
members = ["crates/yata-core", "crates/yata-store", "crates/yata-daemon"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KCN-judu/yata"

[workspace.dependencies]
# internal crates by path, then external crates pinned to a minor version
yata-core = { path = "crates/yata-core" }
yata-store = { path = "crates/yata-store" }
getrandom = "0.4"
# SQLite built in, so every platform runs the same version (ADR-0019)
rusqlite = { version = "0.40", features = ["bundled"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
