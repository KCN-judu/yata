[workspace]
resolver = "3"
members = ["crates/yata-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KCN-judu/yata"

[workspace.dependencies]
# internal crates by path, then external crates pinned to a minor version
yata-core = { path = "crates/yata-core" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
