// The fact schema: the durable encoding of the log's commits (ADR-0002, ADR-0032,
// fact-format.md). Store format 3 (ADR-0033).
//
// Owned by the store module of yata-daemon; nothing outside the daemon reads facts, so no Dart
// bindings are generated. This file has its own version line: a change to a wire schema never
// forces a change here, and a change here never forces a protocol bump.
//
// Evolution rules (ADR-0002, ADR-0032):
// - A tag number is never reused; a removed field's number and name go into `reserved`.
// - A fact's kind and version are its `body` case, written once. A new kind, a new version of
//   one, or a new enum value moves the store format, so a build only ever reads cases and values
//   it knows: an unset `oneof` or an unknown enum value is a malformed commit.
// - A kind's version is bumped only when meaning changes, with a lift step in the daemon.
// - Every enum's zero value is unused, so that an absent value is never read as a real one.

syntax = "proto3";

package yata.fact.v2;

// One commit of the log. The row key of the log table is `seq` as well, and the two must agree.
message Commit {
  uint64 seq = 1;
  // The daemon's wall clock, in Unix milliseconds. Informational; order is `seq`.
  sint64 recorded_at_unix_ms = 2;
  Origin origin = 3;
  // At least one.
  repeated Fact facts = 4;
}

message Origin {
  oneof kind {
    uint64 command_request_id = 1;
    uint64 job_id = 2;
    Maintenance maintenance = 3;
  }
}

message Maintenance {}

// The envelope: what the fact is about, and the fact, typed by its case (PRP-0006, option A).
message Fact {
  // 2 is kept for the store subject of `BlobsPruned`, decided with compaction (ADR-0032).
  reserved 2;
  oneof subject {
    // The 16-byte ProfileId.
    bytes profile = 1;
  }
  oneof body {
    ProfileCreated profile_created_v1 = 10;
    ProfileRenamed profile_renamed_v1 = 11;
    ProfileRetired profile_retired_v1 = 12;
    ProfileRestored profile_restored_v1 = 13;
    SnapshotImported snapshot_imported_v1 = 14;
    SnapshotRetracted snapshot_retracted_v1 = 15;
    SoulMarked soul_marked_v1 = 16;
    SoulNoted soul_noted_v1 = 17;
  }
}

message ProfileCreated {
  string display_name = 1;
  // Absent when the profile was created without knowing its account.
  optional string account_id = 2;
}

message ProfileRenamed {
  string display_name = 1;
}

message ProfileRetired {}

message ProfileRestored {}

// One imported file landed (ADR-0032, rule 4).
message SnapshotImported {
  // SHA-256 of the IR's canonical binary encoding: a blob.
  bytes snapshot = 1;
  // SHA-256 of the file as imported: a blob.
  bytes original = 2;
  SourceFormat source = 3;
  // At least one; each kind once.
  repeated SectionEntry sections = 4;
  // The account the snapshot states; absent when it states none (ADR-0033). Never empty.
  optional string account = 5;
}

message SourceFormat {
  oneof format {
    SchemaVersion yata_snapshot = 1;
    FormatTag community = 2;
  }
}

message SchemaVersion {
  uint32 major = 1;
  uint32 minor = 2;
}

enum FormatTag {
  FORMAT_TAG_UNSPECIFIED = 0;
  FORMAT_TAG_MUMU_SNAPSHOT_V1 = 1;
}

message SectionEntry {
  SectionKind kind = 1;
  Completeness completeness = 2;
}

enum SectionKind {
  SECTION_KIND_UNSPECIFIED = 0;
  SECTION_KIND_SOULS = 1;
  SECTION_KIND_SHIKIGAMI = 2;
  SECTION_KIND_PRESETS = 3;
  SECTION_KIND_ASSETS = 4;
  SECTION_KIND_GUILD = 5;
}

enum Completeness {
  COMPLETENESS_UNSPECIFIED = 0;
  COMPLETENESS_COMPLETE = 1;
  COMPLETENESS_PARTIAL = 2;
  COMPLETENESS_UNSTATED = 3;
}

// Every current import of the snapshot in the profile is withdrawn, all its sections.
message SnapshotRetracted {
  bytes snapshot = 1;
  // Informational; the fold never reads it.
  string reason = 2;
}

enum Mark {
  MARK_UNSPECIFIED = 0;
  // Clears the mark.
  MARK_NONE = 1;
  MARK_KEEP = 2;
  MARK_DISCARD = 3;
  MARK_STRENGTHEN = 4;
}

message SoulMarked {
  string soul_id = 1;
  Mark mark = 2;
}

// A note is a text or a clearing, never an empty text.
message SoulNoted {
  string soul_id = 1;
  oneof note {
    // Never empty.
    string text = 2;
    NoteCleared cleared = 3;
  }
}

message NoteCleared {}
