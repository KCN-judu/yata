// The yata-snapshot format: the snapshot IR as a file and as a stored blob (ADR-0031).
//
// Meaning: docs/spec/snapshot-ir.md. The file form is this schema's proto3 JSON mapping; the
// stored form, whose SHA-256 is the snapshot's identity, is the binary encoding. No map fields,
// so one snapshot has one binary encoding.
// Evolution: a tag number is never reused; a removed field's number and name go into `reserved`.
// Adding a field, a section, or an enum value is a minor version; changing the meaning of an
// existing tag is a major version.

syntax = "proto3";

package yata.snapshot.v1;

// The file's header, and the schema version: `yataSnapshot` in the JSON mapping.
message SchemaVersion {
  uint32 major = 1;
  uint32 minor = 2;
}

message YataSnapshot {
  SchemaVersion yata_snapshot = 1;
  Provenance provenance = 2;
  // As the source states it; informational.
  optional string captured_at = 3;
  // An unset section is absent; a set one is present, with its completeness.
  SoulsSection souls = 4;
  ShikigamiSection shikigami = 5;
  PresetsSection presets = 6;
  AssetsSection assets = 7;
  GuildSection guild = 8;
  // The account the file says it belongs to, when it says; checked against the profile.
  optional string account = 9;
}

enum Completeness {
  COMPLETENESS_UNSPECIFIED = 0;
  COMPLETENESS_UNSTATED = 1;
  COMPLETENESS_PARTIAL = 2;
  COMPLETENESS_COMPLETE = 3;
}

enum FormatTag {
  FORMAT_TAG_UNSPECIFIED = 0;
  FORMAT_TAG_MUMU_SNAPSHOT_V1 = 1;
}

message Provenance {
  oneof format {
    SchemaVersion yata_snapshot = 1;
    FormatTag community = 2;
  }
  // SHA-256 of the imported file's bytes.
  bytes original = 3;
}

enum Attribute {
  ATTRIBUTE_UNSPECIFIED = 0;
  ATTRIBUTE_ATK_FLAT = 1;
  ATTRIBUTE_ATK_PERCENT = 2;
  ATTRIBUTE_DEF_FLAT = 3;
  ATTRIBUTE_DEF_PERCENT = 4;
  ATTRIBUTE_HP_FLAT = 5;
  ATTRIBUTE_HP_PERCENT = 6;
  ATTRIBUTE_SPD = 7;
  ATTRIBUTE_EFFECT_HIT = 8;
  ATTRIBUTE_EFFECT_RES = 9;
  ATTRIBUTE_CRIT = 10;
  ATTRIBUTE_CRIT_DMG = 11;
}

// A value in display units: a rate in percentage points.
message Valued {
  Attribute attribute = 1;
  double value = 2;
}

message RolledSub {
  Valued valued = 1;
  // The strengthening count, if the source stated it.
  optional int64 rolls = 2;
}

message Soul {
  string id = 1;
  // The set's name as the game shows it.
  string set = 2;
  int64 slot = 3;
  int64 star = 4;
  int64 level = 5;
  Valued main = 6;
  repeated RolledSub rolled = 7;
  // The innate attribute, without its value; unset for an ordinary soul.
  optional Attribute innate = 8;
}

message SoulsSection {
  Completeness completeness = 1;
  repeated Soul souls = 2;
}

message Shikigami {
  string id = 1;
  uint32 species = 2;
  int64 level = 3;
  int64 star = 4;
  bool evolved = 5;
  bool locked = 6;
}

message ShikigamiSection {
  Completeness completeness = 1;
  repeated Shikigami instances = 2;
}

// One position of a preset; `soul` unset when the position is empty.
message PresetPosition {
  optional string soul = 1;
}

message Preset {
  string label = 1;
  // Exactly six, by position: index i is slot i + 1.
  repeated PresetPosition positions = 2;
}

message PresetsSection {
  Completeness completeness = 1;
  repeated Preset presets = 2;
}

enum Currency {
  CURRENCY_UNSPECIFIED = 0;
  CURRENCY_ACTION_POINT = 1;
  CURRENCY_AR_AMULET = 2;
  CURRENCY_AUTO_POINT = 3;
  CURRENCY_BROKEN_AMULET = 4;
  CURRENCY_COIN = 5;
  CURRENCY_CONTRIB = 6;
  CURRENCY_DEMON_SOUL = 7;
  CURRENCY_FOOLERY_PASS = 8;
  CURRENCY_GOLD_OFUDA = 9;
  CURRENCY_HONOR = 10;
  CURRENCY_JADE = 11;
  CURRENCY_MEDAL = 12;
  CURRENCY_MYSTERY_AMULET = 13;
  CURRENCY_OFUDA = 14;
  CURRENCY_REALM_RAID_PASS = 15;
  CURRENCY_REVERSE_SCALE = 16;
  CURRENCY_S_JADE = 17;
  CURRENCY_SCALE = 18;
  CURRENCY_SKIN_TOKEN = 19;
  CURRENCY_SP_SKIN_TOKEN = 20;
  CURRENCY_TOTEM_PASS = 21;
}

message CurrencyAmount {
  Currency currency = 1;
  uint64 amount = 2;
}

message RealmCard {
  string id = 1;
  uint32 kind = 2;
}

message AssetsSection {
  Completeness completeness = 1;
  repeated CurrencyAmount currencies = 2;
  repeated RealmCard realm_cards = 3;
}

message GuildSection {
  Completeness completeness = 1;
  uint32 level = 2;
  uint32 member_count = 3;
}
