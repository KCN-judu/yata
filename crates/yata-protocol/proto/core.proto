// The core protocol: the wire between the Flutter application and yata-daemon.
//
// Meaning: docs/spec/core-protocol.md; the query vocabulary: docs/spec/query.md.
// Versions: docs/spec/protocol-versions.md.
// Evolution: a tag number is never reused; a removed field's number and name go into
// `reserved`. Adding a field or a message kind is a minor version; changing the meaning of an
// existing tag is never allowed.
//
// A draft: the domain and query messages, the headless query endpoint, and the session the
// application speaks (envelopes, profiles, soul pages, scheme-code decoding). Commands and jobs
// are added when they exist; version 1 stays reserved until then.

syntax = "proto3";

package yata.core.v1;

message ProtocolVersion {
  uint32 major = 1;
  uint32 minor = 2;
}

// ---- the soul domain (glossary.md) ----

enum SoulSlot {
  SOUL_SLOT_UNSPECIFIED = 0;
  SOUL_SLOT_1 = 1;
  SOUL_SLOT_2 = 2;
  SOUL_SLOT_3 = 3;
  SOUL_SLOT_4 = 4;
  SOUL_SLOT_5 = 5;
  SOUL_SLOT_6 = 6;
}

// In glossary order, which is the order a sort by attribute uses.
enum SoulAttribute {
  SOUL_ATTRIBUTE_UNSPECIFIED = 0;
  SOUL_ATTRIBUTE_ATK_FLAT = 1;
  SOUL_ATTRIBUTE_ATK_PERCENT = 2;
  SOUL_ATTRIBUTE_DEF_FLAT = 3;
  SOUL_ATTRIBUTE_DEF_PERCENT = 4;
  SOUL_ATTRIBUTE_HP_FLAT = 5;
  SOUL_ATTRIBUTE_HP_PERCENT = 6;
  SOUL_ATTRIBUTE_SPD = 7;
  SOUL_ATTRIBUTE_EFFECT_HIT = 8;
  SOUL_ATTRIBUTE_EFFECT_RES = 9;
  SOUL_ATTRIBUTE_CRIT = 10;
  SOUL_ATTRIBUTE_CRIT_DMG = 11;
}

// A soul in domain terms, not the game's record: the set by suit code, values in display units.
message Soul {
  // The game's soul id: non-empty, at most 64 bytes, unique within an inventory.
  string soul_id = 1;
  uint32 suit_code = 2;
  SoulSlot slot = 3;
  uint32 star = 4;
  uint32 level = 5;
  SoulAttribute main = 6;
  double main_value = 7;
  // At most 4.
  repeated SubAttribute subs = 8;
  // Retired: `Innate innate`, whose unknown state and `bool absent` marker ADR-0029 removed.
  reserved 9;
  reserved "innate";
  // Whether the soul is a boss soul (ADR-0029). Exactly one is set; a soul with neither is
  // `query.malformed`.
  oneof kind {
    OrdinarySoul ordinary = 10;
    BossSoul boss = 11;
  }
}

// A soul that is not a boss soul: it carries no innate attribute. Empty on purpose, so that
// choosing it is the whole message.
message OrdinarySoul {}

// A boss soul (首领御魂) and its 固有属性, one of the six innate attributes.
message BossSoul {
  SoulAttribute innate = 1;
}

message SubAttribute {
  SoulAttribute attribute = 1;
  double value = 2;
  optional uint32 enhancement_count = 3;
}

// ---- the official filter (scheme-code.md, "The model") ----

enum LevelBand {
  LEVEL_BAND_UNSPECIFIED = 0;
  LEVEL_BAND_0_TO_2 = 1;
  LEVEL_BAND_3_TO_5 = 2;
  LEVEL_BAND_6_TO_8 = 3;
  LEVEL_BAND_9_TO_11 = 4;
  LEVEL_BAND_12_TO_14 = 5;
  LEVEL_BAND_15 = 6;
}

enum SubCount {
  SUB_COUNT_UNSPECIFIED = 0;
  SUB_COUNT_FEWER_THAN_TWO = 1;
  SUB_COUNT_TWO = 2;
  SUB_COUNT_THREE = 3;
  SUB_COUNT_FOUR = 4;
}

// 全部: no restriction on the set. The game's 类型 with nothing chosen means the same, and is
// written this way only.
message AnySet {}

// Chosen sets, by suit code. Never empty: "every set" is `AnySet`. At most 256.
message SuitCodes {
  repeated uint32 codes = 1;
}

enum SubAttributeMode {
  SUB_ATTRIBUTE_MODE_UNSPECIFIED = 0;
  // ○: the soul has it.
  SUB_ATTRIBUTE_MODE_INCLUDE = 1;
  // ✕: the soul does not have it.
  SUB_ATTRIBUTE_MODE_EXCLUDE = 2;
}

message SubAttributeChoice {
  SoulAttribute attribute = 1;
  SubAttributeMode mode = 2;
}

// A SoulSelection: each group a set of choices, an empty group no constraint. Each repeated
// field holds at most 256 values.
message SoulSelection {
  reserved 1, 2, 8, 9;
  reserved "any_set", "suit_codes", "sub_included", "sub_excluded";
  // 类型: exactly one is set.
  oneof sets {
    AnySet all = 11;
    SuitCodes chosen = 12;
  }
  repeated SoulSlot slots = 3;
  repeated uint32 stars = 4;
  repeated LevelBand levels = 5;
  repeated SoulAttribute main_attributes = 6;
  // One of the six innate attributes.
  repeated SoulAttribute innate = 7;
  // 副属性: ○ or ✕ per attribute, each attribute at most once.
  repeated SubAttributeChoice sub_attributes = 13;
  repeated SubCount sub_counts = 10;
}

// ---- queries (query.md) ----

enum Collection {
  COLLECTION_UNSPECIFIED = 0;
  COLLECTION_SOULS = 1;
}

// The soul fields that take nothing beside their name. A field is added when it can be evaluated.
enum SimpleField {
  SIMPLE_FIELD_UNSPECIFIED = 0;
  SIMPLE_FIELD_SET = 1;
  SIMPLE_FIELD_SLOT = 2;
  SIMPLE_FIELD_STAR = 3;
  SIMPLE_FIELD_LEVEL = 4;
  SIMPLE_FIELD_MAIN_ATTRIBUTE = 5;
  SIMPLE_FIELD_MAIN_VALUE = 6;
  SIMPLE_FIELD_SUB_COUNT = 7;
  SIMPLE_FIELD_PRISTINE = 8;
}

// The components of a quality score. Need `params`; refused with query.field_unavailable until
// pass 1 exists.
enum QualityComponent {
  QUALITY_COMPONENT_UNSPECIFIED = 0;
  QUALITY_COMPONENT_TOTAL = 1;
  QUALITY_COMPONENT_DEPTH = 2;
  QUALITY_COMPONENT_BREADTH = 3;
}

// A field of a soul row: exactly one is set, and a field that takes an attribute carries it.
message Field {
  reserved 1, 2;
  reserved "name", "attribute";
  oneof field {
    SimpleField simple = 3;
    SoulAttribute sub_value = 4;
    SoulAttribute has_sub = 5;
    QualityComponent quality = 6;
  }
}

message Slots {
  repeated SoulSlot values = 1;
}

message Attributes {
  repeated SoulAttribute values = 1;
}

// The values of an `In`: one list, of the field's type. At most 256; never empty.
message InTest {
  reserved 1, 2, 3;
  reserved "suit_codes", "slots", "attributes";
  oneof values {
    SuitCodes set_values = 4;
    Slots slot_values = 5;
    Attributes attribute_values = 6;
  }
}

message IntBetween {
  int64 min = 1;
  int64 max = 2;
}

// Inclusive bounds: exactly one is set; `between` with `min` above `max` is query.malformed.
message IntRange {
  reserved 1, 2;
  reserved "min", "max";
  oneof bound {
    int64 at_least = 3;
    int64 at_most = 4;
    IntBetween between = 5;
  }
}

message NumberBetween {
  double min = 1;
  double max = 2;
}

// As `IntRange`, over finite numbers.
message NumberRange {
  reserved 1, 2;
  reserved "min", "max";
  oneof bound {
    double at_least = 3;
    double at_most = 4;
    NumberBetween between = 5;
  }
}

message Predicate {
  Field field = 1;
  oneof test {
    InTest in = 2;
    IntRange int_range = 3;
    NumberRange number_range = 4;
    bool is = 5;
  }
}

message ExprList {
  repeated Expr items = 1;
}

// A scheme by its code text, and the plan or discard scheme within it. `entry` is required when
// the code holds more than one.
message SchemeRef {
  string code = 1;
  optional uint32 entry = 2;
}

// A filter node. At most 256 nodes and depth 16 in one filter.
message Expr {
  oneof kind {
    // Empty: true.
    ExprList and = 1;
    // Empty: false.
    ExprList or = 2;
    Expr not = 3;
    Predicate pred = 4;
    SoulSelection matches = 5;
    SchemeRef matches_scheme = 6;
  }
}

enum Direction {
  DIRECTION_UNSPECIFIED = 0;
  DIRECTION_ASC = 1;
  DIRECTION_DESC = 2;
}

message SortKey {
  Field field = 1;
  Direction direction = 2;
}

message ParamSetRef {
  string id = 1;
  uint32 version = 2;
}

message PageRequest {
  // Absent: the daemon's default. 1 to 10 000.
  optional uint32 row_budget = 1;
  // Absent: the first page. Otherwise a cursor this query returned, unmodified.
  optional bytes cursor = 2;
}

message Query {
  Collection collection = 1;
  // Absent: every row.
  Expr filter = 2;
  // At most 8 keys; the row identity is the final key.
  repeated SortKey sort = 3;
  ParamSetRef params = 4;
  // The page moved into the request that pages (`EvaluateQuery.page`, `SessionQuery`), and the
  // session's fields into `SessionQuery`: a shared query carries neither.
  reserved 5, 6, 7;
  reserved "page", "profile_id", "scan_revision";
}

enum OpenRule {
  OPEN_RULE_UNSPECIFIED = 0;
  OPEN_RULE_INNATE = 1;
  OPEN_RULE_UNKNOWN_CONDITIONS = 2;
}

// The row is in the game's selection however the open rules are settled (ADR-0026).
message ExactVerdict {}

// The row is open, and rests on these rules: at least one, each once.
message OpenVerdict {
  repeated OpenRule rules = 1;
}

message QueryRow {
  reserved 2;
  reserved "open_rules";
  string soul_id = 1;
  // Exactly one is set.
  oneof verdict {
    ExactVerdict exact = 4;
    OpenVerdict open = 5;
  }
  // The session's rows carry their soul in `SessionRow`.
  reserved 3;
  reserved "soul";
}

message QueryPage {
  reserved 2, 3;
  reserved "has_more", "cursor";
  repeated QueryRow rows = 1;
  // Present when more rows follow: the cursor of the next page. Opaque: sent back unmodified,
  // never parsed.
  optional bytes next_cursor = 6;
  // The headless endpoint has no projection, so no revision; the session's is in
  // `SessionQueryPage`.
  reserved 4;
  reserved "revision";
  // Every row the query keeps, exact or open, across all pages.
  uint64 total = 5;
}

// ---- the headless query endpoint (ADR-0026, rule 6) ----

// A query over an inventory the request supplies, until the projection exists. One
// EvaluateQueryResult answers each request, with the same `id`.
message EvaluateQuery {
  uint64 id = 1;
  ProtocolVersion protocol_version = 2;
  // At most 100 000 souls.
  repeated Soul inventory = 3;
  Query query = 4;
  PageRequest page = 5;
}

// A request frame that is not an `EvaluateQuery`, so no id can be answered.
message Undecodable {}

message EvaluateQueryResult {
  // The request answered: its id, or that it did not decode.
  oneof subject {
    uint64 id = 1;
    Undecodable undecodable = 4;
  }
  oneof outcome {
    QueryPage page = 2;
    Error error = 3;
  }
}

// ---- the session (core-protocol.md): envelopes ----

// Client to daemon: one request per frame.
message ClientMessage {
  // Moved into `OpenSession.client_version`: the version is read once, at session start.
  reserved 1;
  reserved "protocol_version";
  // Chosen by the client, unique within the session, never reused. Never zero.
  uint64 id = 2;
  oneof kind {
    OpenSession open_session = 10;
    Shutdown shutdown = 11;
    Subscribe subscribe = 12;
    // Queries.
    ListProfiles list_profiles = 20;
    SessionQuery session_query = 23;
    DecodeSchemeCode decode_scheme_code = 22;
  }
  // A shared `Query` carried the session's fields; `SessionQuery` carries them now.
  reserved 21;
  reserved "query";
}

// Daemon to client: a response to one request, or an event.
message ServerMessage {
  oneof kind {
    Response response = 1;
    Event event = 2;
  }
}

// Exactly one per request, carrying the request's id.
message Response {
  uint64 id = 1;
  oneof result {
    Error error = 2;
    SessionOpened session_opened = 10;
    ShutdownAccepted shutdown_accepted = 11;
    Subscribed subscribed = 12;
    ProfileList profile_list = 20;
    SessionQueryPage session_query_page = 23;
    SchemeCodeDecoded scheme_code_decoded = 22;
  }
  reserved 21;
  reserved "query_page";
}

// Not a response: something the client did not ask for.
message Event {
  oneof kind {
    ProjectionChanged projection_changed = 1;
    Warning warning = 2;
    // The session cannot continue, and the daemon exits after sending it.
    SessionFailed session_failure = 4;
  }
  // Carried an `Error`, which mixed the failures of one request with those of the session.
  reserved 3;
  reserved "session_failed";
}

// ---- the session: lifecycle and subscriptions ----

// The first request of a session. Anything before it is refused with `session.not_open`.
message OpenSession {
  // The protocol version the client was built against; absent is refused.
  ProtocolVersion client_version = 1;
}

message SessionOpened {
  ProtocolVersion daemon_version = 1;
  // The projection's revision when the session opened: the `seq` of the last commit, 0 for the
  // empty log (a real revision, not "none").
  uint64 revision = 2;
}

// Ends the session: the daemon answers, then exits once its output is flushed.
message Shutdown {}

message ShutdownAccepted {}

// Asks for a `ProjectionChanged` whenever the projection moves past `revision`.
message Subscribe {
  // The latest revision the client holds.
  uint64 revision = 1;
}

message Subscribed {
  uint64 revision = 1;
}

// The projection moved. A revision, never a value: the client queries for what it shows.
message ProjectionChanged {
  uint64 revision = 1;
}

// ---- the session: profiles ----

message ListProfiles {}

message ProfileList {
  uint64 revision = 1;
  repeated Profile profiles = 2;
}

// One game account (GameProfile).
message Profile {
  // The profile's id: 32 lowercase hex digits, its 16 bytes. Sent back unmodified.
  string id = 1;
  // The user's own name for it.
  string name = 2;
  // What the profile can do, derived from the sections its imports hold (snapshot-ir.md,
  // "Capabilities"), never from a file's format. Every capability of this schema, each once, in
  // the order of `Capability`.
  repeated ProfileCapability capabilities = 3;
}

// A section of an imported snapshot (snapshot-ir.md).
enum SectionKind {
  SECTION_KIND_UNSPECIFIED = 0;
  SECTION_KIND_SOULS = 1;
  SECTION_KIND_SHIKIGAMI = 2;
  SECTION_KIND_PRESETS = 3;
  SECTION_KIND_ASSETS = 4;
  SECTION_KIND_GUILD = 5;
}

// Whether a present section holds everything it covers, by the source's own statement. Weakest
// first.
enum Completeness {
  COMPLETENESS_UNSPECIFIED = 0;
  COMPLETENESS_UNSTATED = 1;
  COMPLETENESS_PARTIAL = 2;
  COMPLETENESS_COMPLETE = 3;
}

// What a profile can do (snapshot-ir.md, "Capabilities").
enum Capability {
  CAPABILITY_UNSPECIFIED = 0;
  // The soul list, the filters, quality, and the recommendations.
  CAPABILITY_INVENTORY = 1;
  CAPABILITY_SHIKIGAMI_COLLECTION = 2;
  // The player's saved loadouts.
  CAPABILITY_GAME_PRESETS = 3;
  CAPABILITY_ASSETS = 4;
  CAPABILITY_GUILD_VIEW = 5;
}

// One capability of a profile and whether it can be used.
message ProfileCapability {
  Capability capability = 1;
  // Exactly one is set.
  oneof availability {
    CapabilityUnavailable unavailable = 2;
    CapabilityAvailable available = 3;
  }
}

// The profile lacks sections the capability needs. It is answered with these, never with empty
// data.
message CapabilityUnavailable {
  // The sections missing, each once; never empty.
  repeated SectionKind missing = 1;
}

// The profile holds every section the capability needs.
message CapabilityAvailable {
  // The weakest completeness of those sections.
  Completeness completeness = 1;
}

// ---- the session: soul queries (core-protocol.md, "Queries and pages") ----

// A query over one profile's souls. A later page carries the cursor and the revision its scan
// began at together, so a cursor never travels without its scan.
message SessionQuery {
  string profile_id = 1;
  Query query = 2;
  // Absent: the daemon's default. 1 to 10 000.
  optional uint32 row_budget = 3;
  // Exactly one; absent is refused.
  oneof position {
    FirstPage first = 4;
    NextPage next = 5;
  }
}

message FirstPage {}

message NextPage {
  // A cursor a page of this scan returned, unmodified; never empty.
  bytes cursor = 1;
  // The revision the scan's first page was valid at. Refused with `query.stale_revision` when
  // the projection has moved.
  uint64 scan = 2;
}

message SessionQueryPage {
  repeated SessionRow rows = 1;
  // Present when more rows follow.
  optional bytes next_cursor = 2;
  // Every row the query keeps, exact or open, across all pages.
  uint64 total = 3;
  // The revision the page is valid at.
  uint64 revision = 4;
}

// A row with the values the application shows: the soul, and the query's verdict on it.
message SessionRow {
  Soul soul = 1;
  // Exactly one is set.
  oneof verdict {
    ExactVerdict exact = 2;
    OpenVerdict open = 3;
  }
}

// ---- the session: scheme codes (scheme-code.md, "Codec") ----

// A scheme code from its QR image or its Base64 text.
message DecodeSchemeCode {
  oneof source {
    string text = 1;
    // One PNG image holding one QR code.
    bytes png = 2;
  }
}

message SchemeCodeDecoded {
  SchemeKind kind = 1;
  // The plans of a strengthening scheme set, or the discard schemes, in code order.
  repeated SchemeEntry entries = 2;
  // The code as it was read, for presentation and sharing.
  EncodedScheme encoded = 3;
}

enum SchemeKind {
  SCHEME_KIND_UNSPECIFIED = 0;
  SCHEME_KIND_STRENGTHENING = 1;
  SCHEME_KIND_DISCARD = 2;
}

// A strengthening plan or a discard scheme: a name and a selection.
message SchemeEntry {
  string name = 1;
  SoulSelection selection = 2;
  // The record selects on a condition the model cannot see, so no evaluation of it is exact.
  bool has_unknown_conditions = 3;
}

// The scheme text and the QR matrix the application draws; the application never encodes.
message EncodedScheme {
  string text = 1;
  // Absent when the text does not fit a QR code.
  QrMatrix qr = 2;
}

// Modules row by row from the top left, one byte each: 1 is dark. No quiet zone included.
message QrMatrix {
  uint32 size = 1;
  bytes modules = 2;
}

// ---- failures (core-protocol.md, "Errors") ----
//
// A failure is one case of a `kind` oneof, and the case is its code: the field name with its
// first `_` read as `.` (`query_stale_revision` is `query.stale_revision`). Each case carries the
// debug record of that code: what a developer needs to diagnose it, shown in logs and the
// expert view, never as the user's text. The application writes the user's text — the cause and
// the remedy — from the case. `message` is English, for developers, and never parsed.
//
// Three sets, by what their receiver does with them: `Error` answers one request; `SessionFailed`
// ends the session; `ClientFailure` never crosses the wire and is raised by the application
// itself. A new code is a new case, which the exhaustive matches on both sides then have to name.

message Error {
  reserved 1, 3;
  reserved "code", "details";
  // The reader's import codes, retired with it (ADR-0030; protocol-versions.md, "Error-code
  // aliases").
  reserved 60 to 64;
  reserved "import_profile_mismatch", "import_malformed_reading", "import_reading_too_large",
    "import_unestablished_identity", "import_duplicate_soul";
  string message = 2;
  oneof kind {
    SessionProtocolUnsupported session_protocol_unsupported = 10;
    SessionNotOpen session_not_open = 11;
    SessionAlreadyOpen session_already_open = 12;
    SessionInvalidRequestId session_invalid_request_id = 13;
    SessionUnknownRequest session_unknown_request = 14;

    QueryUnknownProfile query_unknown_profile = 20;
    QueryStaleRevision query_stale_revision = 21;
    QueryMalformed query_malformed = 22;
    QueryUnknownField query_unknown_field = 23;
    QueryTooComplex query_too_complex = 24;
    QueryTypeMismatch query_type_mismatch = 25;
    QueryParamSetRequired query_param_set_required = 26;
    QueryFieldUnavailable query_field_unavailable = 27;
    QueryUnknownScheme query_unknown_scheme = 28;
    QueryMalformedCursor query_malformed_cursor = 29;

    DecodeNoInput decode_no_input = 40;
    DecodeMalformedText decode_malformed_text = 41;
    DecodeUnknownFormat decode_unknown_format = 42;
    DecodeMalformedLayout decode_malformed_layout = 43;
    DecodeMalformedScheme decode_malformed_scheme = 44;
    DecodeImageInvalid decode_image_invalid = 45;
    DecodeNoQrCode decode_no_qr_code = 46;
    DecodeSeveralQrCodes decode_several_qr_codes = 47;
    DecodeQrUnreadable decode_qr_unreadable = 48;

    // An imported file (snapshot-ir.md; ADR-0031, rule 6): refused whole, typed by the stage
    // that refused it.
    ImportUnknownFormat import_unknown_format = 50;
    ImportAmbiguousFormat import_ambiguous_format = 51;
    ImportUnsupportedVersion import_unsupported_version = 52;
    ImportMalformedSource import_malformed_source = 53;
    ImportNormalizationFailed import_normalization_failed = 54;
    ImportUnsupportedSourceValue import_unsupported_source_value = 55;
    ImportInconsistentReference import_inconsistent_reference = 56;
    ImportAdmissionRefused import_admission_refused = 57;
    ImportAccountMismatch import_account_mismatch = 58;

    CommandRefused command_refused = 70;
    CommandTooLarge command_too_large = 71;

    StoreFailure store_failure = 80;
    StoreInvalidLog store_invalid_log = 81;
    StoreNewerFormat store_newer_format = 82;
    StoreMalformedCommit store_malformed_commit = 83;
    StoreMissing store_missing = 84;
    StoreNotADatabase store_not_a_database = 85;
    StoreForeign store_foreign = 86;
    StoreNoFormatVersion store_no_format_version = 87;
    StoreDamaged store_damaged = 88;
    StoreUninitialized store_uninitialized = 89;
    StoreRetiredFormat store_retired_format = 90;

    InternalPanic internal_panic = 100;
    InternalQrTooLong internal_qr_too_long = 101;
    InternalResponseTooLarge internal_response_too_large = 102;
    InternalPageWithoutSoul internal_page_without_soul = 103;
  }
}

// The session cannot continue; the daemon exits after sending it. No request id is known for it.
message SessionFailed {
  string message = 1;
  oneof kind {
    SessionMalformedFrame session_malformed_frame = 10;
    SessionMalformedMessage session_malformed_message = 11;
    InternalIo internal_io = 12;
  }
}

// Raised by the application for what only it can see. Never sent: it is in this file so that
// every code has one list and both sides read it from one place.
message ClientFailure {
  oneof kind {
    ClientDaemonNotFound client_daemon_not_found = 10;
    ClientDaemonStartFailed client_daemon_start_failed = 11;
    ClientDaemonExited client_daemon_exited = 12;
    ClientTimeout client_timeout = 13;
    ClientProtocolError client_protocol_error = 14;
    ClientNotConnected client_not_connected = 15;
    ClientUnexpected client_unexpected = 16;
  }
}

// The debug record of each code. A `problem` is the English rendering of the typed failure the
// daemon holds, for diagnosis; nothing reads it.

message SessionProtocolUnsupported {
  // Absent when the client sent no version.
  ProtocolVersion client = 1;
  ProtocolVersion daemon = 2;
}
message SessionNotOpen {
  // The request kind that came before `OpenSession`, as its field name.
  string request = 1;
}
message SessionAlreadyOpen {}
message SessionInvalidRequestId {
  uint64 id = 1;
}
message SessionUnknownRequest {}

message QueryUnknownProfile {
  string profile_id = 1;
}
message QueryStaleRevision {
  // The revision the scan began at, and the projection's.
  uint64 scan = 1;
  uint64 current = 2;
}
message QueryMalformed {
  string problem = 1;
}
message QueryUnknownField {
  int32 value = 1;
}
message QueryTooComplex {
  string limit = 1;
  uint64 found = 2;
  uint64 max = 3;
}
message QueryTypeMismatch {
  string problem = 1;
}
message QueryParamSetRequired {
  string field = 1;
}
message QueryFieldUnavailable {
  string field = 1;
}
message QueryUnknownScheme {
  string problem = 1;
}
message QueryMalformedCursor {}

message DecodeNoInput {}
message DecodeMalformedText {
  // The transport layer that refused the text, with its position.
  string problem = 1;
}
message DecodeUnknownFormat {
  uint64 payload_bytes = 1;
}
message DecodeMalformedLayout {
  string problem = 1;
}
message DecodeMalformedScheme {
  // The plan or discard scheme, by position in the code; absent when no one record is at fault.
  optional uint32 record = 1;
  string problem = 2;
}
message DecodeImageInvalid {
  string problem = 1;
}
message DecodeNoQrCode {}
message DecodeSeveralQrCodes {
  uint32 count = 1;
}
message DecodeQrUnreadable {
  string problem = 1;
}

// No format recognises the file's header.
message ImportUnknownFormat {
  // The format the file names, when it names one.
  optional string stated = 1;
}
// More than one format recognises the header.
message ImportAmbiguousFormat {
  // The formats that do, by tag.
  repeated string formats = 1;
}
// The format is known and the file's version of it is not one this build reads.
message ImportUnsupportedVersion {
  string format = 1;
  // The version as the file states it.
  string version = 2;
}
// Not the syntax or shape of any snapshot: not JSON, over the file limit, a file-level field
// missing or of the wrong kind.
message ImportMalformedSource {
  string problem = 1;
}
// The file parsed, and what it normalized to breaks the snapshot IR's own rules: a count over its
// limit, an id twice.
message ImportNormalizationFailed {
  string problem = 1;
}
// A file-level value the format does not define.
message ImportUnsupportedSourceValue {
  // The field, as the format names it, and its value.
  string field = 1;
  string value = 2;
}
// A record names another that the snapshot does not hold.
message ImportInconsistentReference {
  string problem = 1;
}
// The domain refused what the snapshot holds.
message ImportAdmissionRefused {
  string problem = 1;
}
// The file states an account other than the one the profile is bound to. The accounts are
// account data, so they are in `problem` alone, never in fields of their own.
message ImportAccountMismatch {
  string problem = 1;
}

message CommandRefused {
  string problem = 1;
}
message CommandTooLarge {
  string problem = 1;
}

message StoreFailure {
  string problem = 1;
}
message StoreInvalidLog {
  string problem = 1;
}
message StoreNewerFormat {
  string problem = 1;
}
message StoreMalformedCommit {
  string problem = 1;
}
message StoreMissing {
  string path = 1;
}
message StoreNotADatabase {}
message StoreForeign {
  int64 application_id = 1;
  int64 objects = 2;
}
message StoreNoFormatVersion {}
message StoreDamaged {
  repeated string problems = 1;
}
message StoreUninitialized {}
// The store is in a format no build reads any more (ADR-0032, rule 3). Nothing was written to it.
message StoreRetiredFormat {
  // The store's format version.
  uint32 found = 1;
}

message InternalPanic {}
message InternalQrTooLong {
  uint64 bits = 1;
  uint64 capacity_bits = 2;
}
message InternalResponseTooLarge {
  string problem = 1;
}
// A page row whose soul is not among the souls the page was selected from: a daemon bug.
message InternalPageWithoutSoul {
  string soul_id = 1;
}

message SessionMalformedFrame {
  string problem = 1;
}
message SessionMalformedMessage {
  string problem = 1;
}
message InternalIo {
  string problem = 1;
}

message ClientDaemonNotFound {
  // Every path tried, in order.
  repeated string searched = 1;
}
message ClientDaemonStartFailed {
  string path = 1;
  string problem = 2;
}
message ClientDaemonExited {
  int32 exit_code = 1;
  // The daemon's last stderr line; absent when it wrote none.
  optional string last_log_line = 2;
}
message ClientTimeout {
  uint64 request_id = 1;
  uint64 limit_ms = 2;
}
message ClientProtocolError {
  string problem = 1;
}
message ClientNotConnected {}
message ClientUnexpected {
  string problem = 1;
}

// Surfaced to the user; changes no state and advances no revision. Not a failure: it has no
// code, only its kind.
message Warning {
  reserved 1;
  reserved "code";
  string message = 2;
  oneof kind {
    ClientOutdated client_outdated = 10;
  }
}

// The client was built against an older major than the daemon's; the session opened anyway.
message ClientOutdated {
  ProtocolVersion client = 1;
  ProtocolVersion daemon = 2;
}
