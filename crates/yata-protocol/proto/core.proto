// The core protocol: the wire between the Flutter application and yata-daemon.
//
// Meaning: docs/spec/core-protocol.md; the query vocabulary: docs/spec/query.md.
// Versions: docs/spec/protocol-versions.md.
// Evolution: a tag number is never reused; a removed field's number and name go into
// `reserved`. Adding a field or a message kind is a minor version; changing the meaning of an
// existing tag is never allowed.
//
// A draft: the domain and query messages, the headless query endpoint, and the session the
// application speaks (envelopes, profiles, soul pages, scheme-code decoding). Commands and jobs
// are added when they exist; version 1 stays reserved until then.

syntax = "proto3";

package yata.core.v1;

message ProtocolVersion {
  uint32 major = 1;
  uint32 minor = 2;
}

// Every failure (core-protocol.md, "Errors"). `code` is the contract; `message` is English and
// never parsed.
message Error {
  string code = 1;
  string message = 2;
  bytes details = 3;
}

// ---- the soul domain (glossary.md) ----

enum SoulSlot {
  SOUL_SLOT_UNSPECIFIED = 0;
  SOUL_SLOT_1 = 1;
  SOUL_SLOT_2 = 2;
  SOUL_SLOT_3 = 3;
  SOUL_SLOT_4 = 4;
  SOUL_SLOT_5 = 5;
  SOUL_SLOT_6 = 6;
}

// In glossary order, which is the order a sort by attribute uses.
enum SoulAttribute {
  SOUL_ATTRIBUTE_UNSPECIFIED = 0;
  SOUL_ATTRIBUTE_ATK_FLAT = 1;
  SOUL_ATTRIBUTE_ATK_PERCENT = 2;
  SOUL_ATTRIBUTE_DEF_FLAT = 3;
  SOUL_ATTRIBUTE_DEF_PERCENT = 4;
  SOUL_ATTRIBUTE_HP_FLAT = 5;
  SOUL_ATTRIBUTE_HP_PERCENT = 6;
  SOUL_ATTRIBUTE_SPD = 7;
  SOUL_ATTRIBUTE_EFFECT_HIT = 8;
  SOUL_ATTRIBUTE_EFFECT_RES = 9;
  SOUL_ATTRIBUTE_CRIT = 10;
  SOUL_ATTRIBUTE_CRIT_DMG = 11;
}

// A soul in domain terms, not the game's record: the set by suit code, values in display units.
message Soul {
  // The game's soul id: non-empty, at most 64 bytes, unique within an inventory.
  string soul_id = 1;
  uint32 suit_code = 2;
  SoulSlot slot = 3;
  uint32 star = 4;
  uint32 level = 5;
  SoulAttribute main = 6;
  double main_value = 7;
  // At most 4.
  repeated SubAttribute subs = 8;
  // Retired: `Innate innate`, whose unknown state and `bool absent` marker ADR-0029 removed.
  reserved 9;
  reserved "innate";
  // Whether the soul is a boss soul (ADR-0029). Exactly one is set; a soul with neither is
  // `query.malformed`.
  oneof kind {
    OrdinarySoul ordinary = 10;
    BossSoul boss = 11;
  }
}

// A soul that is not a boss soul: it carries no innate attribute. Empty on purpose, so that
// choosing it is the whole message.
message OrdinarySoul {}

// A boss soul (首领御魂) and its 固有属性, one of the six innate attributes.
message BossSoul {
  SoulAttribute innate = 1;
}

message SubAttribute {
  SoulAttribute attribute = 1;
  double value = 2;
  optional uint32 enhancement_count = 3;
}

// ---- the official filter (scheme-code.md, "The model") ----

enum LevelBand {
  LEVEL_BAND_UNSPECIFIED = 0;
  LEVEL_BAND_0_TO_2 = 1;
  LEVEL_BAND_3_TO_5 = 2;
  LEVEL_BAND_6_TO_8 = 3;
  LEVEL_BAND_9_TO_11 = 4;
  LEVEL_BAND_12_TO_14 = 5;
  LEVEL_BAND_15 = 6;
}

enum SubCount {
  SUB_COUNT_UNSPECIFIED = 0;
  SUB_COUNT_FEWER_THAN_TWO = 1;
  SUB_COUNT_TWO = 2;
  SUB_COUNT_THREE = 3;
  SUB_COUNT_FOUR = 4;
}

// 全部: no restriction on the set. The game's 类型 with nothing chosen means the same, and is
// written this way only.
message AnySet {}

// Chosen sets, by suit code. Never empty: "every set" is `AnySet`. At most 256.
message SuitCodes {
  repeated uint32 codes = 1;
}

enum SubAttributeMode {
  SUB_ATTRIBUTE_MODE_UNSPECIFIED = 0;
  // ○: the soul has it.
  SUB_ATTRIBUTE_MODE_INCLUDE = 1;
  // ✕: the soul does not have it.
  SUB_ATTRIBUTE_MODE_EXCLUDE = 2;
}

message SubAttributeChoice {
  SoulAttribute attribute = 1;
  SubAttributeMode mode = 2;
}

// A SoulSelection: each group a set of choices, an empty group no constraint. Each repeated
// field holds at most 256 values.
message SoulSelection {
  reserved 1, 2, 8, 9;
  reserved "any_set", "suit_codes", "sub_included", "sub_excluded";
  // 类型: exactly one is set.
  oneof sets {
    AnySet all = 11;
    SuitCodes chosen = 12;
  }
  repeated SoulSlot slots = 3;
  repeated uint32 stars = 4;
  repeated LevelBand levels = 5;
  repeated SoulAttribute main_attributes = 6;
  // One of the six innate attributes.
  repeated SoulAttribute innate = 7;
  // 副属性: ○ or ✕ per attribute, each attribute at most once.
  repeated SubAttributeChoice sub_attributes = 13;
  repeated SubCount sub_counts = 10;
}

// ---- queries (query.md) ----

enum Collection {
  COLLECTION_UNSPECIFIED = 0;
  COLLECTION_SOULS = 1;
}

// The soul fields that take nothing beside their name. A field is added when it can be evaluated.
enum SimpleField {
  SIMPLE_FIELD_UNSPECIFIED = 0;
  SIMPLE_FIELD_SET = 1;
  SIMPLE_FIELD_SLOT = 2;
  SIMPLE_FIELD_STAR = 3;
  SIMPLE_FIELD_LEVEL = 4;
  SIMPLE_FIELD_MAIN_ATTRIBUTE = 5;
  SIMPLE_FIELD_MAIN_VALUE = 6;
  SIMPLE_FIELD_SUB_COUNT = 7;
  SIMPLE_FIELD_PRISTINE = 8;
}

// The components of a quality score. Need `params`; refused with query.field_unavailable until
// pass 1 exists.
enum QualityComponent {
  QUALITY_COMPONENT_UNSPECIFIED = 0;
  QUALITY_COMPONENT_TOTAL = 1;
  QUALITY_COMPONENT_DEPTH = 2;
  QUALITY_COMPONENT_BREADTH = 3;
}

// A field of a soul row: exactly one is set, and a field that takes an attribute carries it.
message Field {
  reserved 1, 2;
  reserved "name", "attribute";
  oneof field {
    SimpleField simple = 3;
    SoulAttribute sub_value = 4;
    SoulAttribute has_sub = 5;
    QualityComponent quality = 6;
  }
}

message Slots {
  repeated SoulSlot values = 1;
}

message Attributes {
  repeated SoulAttribute values = 1;
}

// The values of an `In`: one list, of the field's type. At most 256; never empty.
message InTest {
  reserved 1, 2, 3;
  reserved "suit_codes", "slots", "attributes";
  oneof values {
    SuitCodes set_values = 4;
    Slots slot_values = 5;
    Attributes attribute_values = 6;
  }
}

message IntBetween {
  int64 min = 1;
  int64 max = 2;
}

// Inclusive bounds: exactly one is set; `between` with `min` above `max` is query.malformed.
message IntRange {
  reserved 1, 2;
  reserved "min", "max";
  oneof bound {
    int64 at_least = 3;
    int64 at_most = 4;
    IntBetween between = 5;
  }
}

message NumberBetween {
  double min = 1;
  double max = 2;
}

// As `IntRange`, over finite numbers.
message NumberRange {
  reserved 1, 2;
  reserved "min", "max";
  oneof bound {
    double at_least = 3;
    double at_most = 4;
    NumberBetween between = 5;
  }
}

message Predicate {
  Field field = 1;
  oneof test {
    InTest in = 2;
    IntRange int_range = 3;
    NumberRange number_range = 4;
    bool is = 5;
  }
}

message ExprList {
  repeated Expr items = 1;
}

// A scheme by its code text, and the plan or discard scheme within it. `entry` is required when
// the code holds more than one.
message SchemeRef {
  string code = 1;
  optional uint32 entry = 2;
}

// A filter node. At most 256 nodes and depth 16 in one filter.
message Expr {
  oneof kind {
    // Empty: true.
    ExprList and = 1;
    // Empty: false.
    ExprList or = 2;
    Expr not = 3;
    Predicate pred = 4;
    SoulSelection matches = 5;
    SchemeRef matches_scheme = 6;
  }
}

enum Direction {
  DIRECTION_UNSPECIFIED = 0;
  DIRECTION_ASC = 1;
  DIRECTION_DESC = 2;
}

message SortKey {
  Field field = 1;
  Direction direction = 2;
}

message ParamSetRef {
  string id = 1;
  uint32 version = 2;
}

message PageRequest {
  // Absent: the daemon's default. 1 to 10 000.
  optional uint32 row_budget = 1;
  // Absent: the first page. Otherwise a cursor this query returned, unmodified.
  optional bytes cursor = 2;
}

message Query {
  Collection collection = 1;
  // Absent: every row.
  Expr filter = 2;
  // At most 8 keys; the row identity is the final key.
  repeated SortKey sort = 3;
  ParamSetRef params = 4;
  PageRequest page = 5;
  // The session only (`ClientMessage.query`): the profile the rows come from. The headless
  // endpoint supplies its own inventory and ignores it.
  string profile_id = 6;
  // The session only: absent on a scan's first page; every later page repeats the revision the
  // first page was valid at, and is refused with `query.stale_revision` if the projection moved.
  optional uint64 scan_revision = 7;
}

enum OpenRule {
  OPEN_RULE_UNSPECIFIED = 0;
  OPEN_RULE_INNATE = 1;
  OPEN_RULE_UNKNOWN_CONDITIONS = 2;
}

// The row is in the game's selection however the open rules are settled (ADR-0026).
message ExactVerdict {}

// The row is open, and rests on these rules: at least one, each once.
message OpenVerdict {
  repeated OpenRule rules = 1;
}

message QueryRow {
  reserved 2;
  reserved "open_rules";
  string soul_id = 1;
  // Exactly one is set.
  oneof verdict {
    ExactVerdict exact = 4;
    OpenVerdict open = 5;
  }
  // The session only: the row's values, so the application shows what the daemon holds without a
  // second request. The headless endpoint leaves it absent; its caller supplied the souls.
  Soul soul = 3;
}

message QueryPage {
  reserved 2, 3;
  reserved "has_more", "cursor";
  repeated QueryRow rows = 1;
  // Present when more rows follow: the cursor of the next page. Opaque: sent back unmodified,
  // never parsed.
  optional bytes next_cursor = 6;
  // The revision the page is valid at; zero from the headless endpoint, which has no projection.
  uint64 revision = 4;
  // Every row the query keeps, exact or open, across all pages.
  uint64 total = 5;
}

// ---- the headless query endpoint (ADR-0026, rule 6) ----

// A query over an inventory the request supplies, until the projection exists. One
// EvaluateQueryResult answers each request, with the same `id`.
message EvaluateQuery {
  uint64 id = 1;
  ProtocolVersion protocol_version = 2;
  // At most 100 000 souls.
  repeated Soul inventory = 3;
  Query query = 4;
}

// A request frame that is not an `EvaluateQuery`, so no id can be answered.
message Undecodable {}

message EvaluateQueryResult {
  // The request answered: its id, or that it did not decode.
  oneof subject {
    uint64 id = 1;
    Undecodable undecodable = 4;
  }
  oneof outcome {
    QueryPage page = 2;
    Error error = 3;
  }
}

// ---- the session (core-protocol.md): envelopes ----

// Client to daemon: one request per frame.
message ClientMessage {
  // The protocol version the client was built against. Compared at `OpenSession`.
  ProtocolVersion protocol_version = 1;
  // Chosen by the client, unique within the session, never reused. Never zero.
  uint64 id = 2;
  oneof kind {
    OpenSession open_session = 10;
    Shutdown shutdown = 11;
    Subscribe subscribe = 12;
    // Queries.
    ListProfiles list_profiles = 20;
    // Carries `profile_id`, and `scan_revision` after the first page.
    Query query = 21;
    DecodeSchemeCode decode_scheme_code = 22;
  }
}

// Daemon to client: a response to one request, or an event.
message ServerMessage {
  oneof kind {
    Response response = 1;
    Event event = 2;
  }
}

// Exactly one per request, carrying the request's id.
message Response {
  uint64 id = 1;
  oneof result {
    Error error = 2;
    SessionOpened session_opened = 10;
    ShutdownAccepted shutdown_accepted = 11;
    Subscribed subscribed = 12;
    ProfileList profile_list = 20;
    // Every row carries `soul`, and the page its `revision` and `total`.
    QueryPage query_page = 21;
    SchemeCodeDecoded scheme_code_decoded = 22;
  }
}

// Not a response: something the client did not ask for.
message Event {
  oneof kind {
    ProjectionChanged projection_changed = 1;
    Warning warning = 2;
    // The session cannot continue, and the daemon exits after sending it: a frame that does not
    // decode, or a payload that is not a `ClientMessage`. No request id is known for it.
    Error session_failed = 3;
  }
}

// Surfaced to the user; changes no state and advances no revision.
message Warning {
  string code = 1;
  string message = 2;
}

// ---- the session: lifecycle and subscriptions ----

// The first request of a session. Anything before it is refused with `session.not_open`.
message OpenSession {}

message SessionOpened {
  ProtocolVersion daemon_version = 1;
  // The projection's revision when the session opened.
  uint64 revision = 2;
}

// Ends the session: the daemon answers, then exits once its output is flushed.
message Shutdown {}

message ShutdownAccepted {}

// Asks for a `ProjectionChanged` whenever the projection moves past `revision`.
message Subscribe {
  // The latest revision the client holds.
  uint64 revision = 1;
}

message Subscribed {
  uint64 revision = 1;
}

// The projection moved. A revision, never a value: the client queries for what it shows.
message ProjectionChanged {
  uint64 revision = 1;
}

// ---- the session: profiles ----

message ListProfiles {}

message ProfileList {
  uint64 revision = 1;
  repeated Profile profiles = 2;
}

// One game account (GameProfile).
message Profile {
  // Opaque; sent back unmodified.
  string id = 1;
  // The user's own name for it.
  string name = 2;
}

// ---- the session: scheme codes (scheme-code.md, "Codec") ----

// A scheme code from its QR image or its Base64 text.
message DecodeSchemeCode {
  oneof source {
    string text = 1;
    // One PNG image holding one QR code.
    bytes png = 2;
  }
}

message SchemeCodeDecoded {
  SchemeKind kind = 1;
  // The plans of a strengthening scheme set, or the discard schemes, in code order.
  repeated SchemeEntry entries = 2;
  // The code as it was read, for presentation and sharing.
  EncodedScheme encoded = 3;
}

enum SchemeKind {
  SCHEME_KIND_UNSPECIFIED = 0;
  SCHEME_KIND_STRENGTHENING = 1;
  SCHEME_KIND_DISCARD = 2;
}

// A strengthening plan or a discard scheme: a name and a selection.
message SchemeEntry {
  string name = 1;
  SoulSelection selection = 2;
  // The record selects on a condition the model cannot see, so no evaluation of it is exact.
  bool has_unknown_conditions = 3;
}

// The scheme text and the QR matrix the application draws; the application never encodes.
message EncodedScheme {
  string text = 1;
  // Absent when the text does not fit a QR code.
  QrMatrix qr = 2;
}

// Modules row by row from the top left, one byte each: 1 is dark. No quiet zone included.
message QrMatrix {
  uint32 size = 1;
  bytes modules = 2;
}
