# The Flutter lints, with strict typing: no implicit dynamic casts, inference, or raw types.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - prefer_single_quotes
    - unawaited_futures
    - avoid_dynamic_calls

formatter:
  page_width: 100
