[package]
name = "yata-quality-calibration"
version = "0.1.0"
edition = "2024"
publish = false
description = "Reproduces the numbers of the Yata Quality Model v1: exact reference distributions, calibration rates, sensitivity, and test vectors."
license = "MIT OR Apache-2.0"

# Not a member of the product workspace: nothing in the product depends on it (ADR-0023).
[workspace]

[dependencies]
num-bigint = "0.4"
num-rational = { version = "0.4", default-features = false, features = ["num-bigint-std"] }
num-traits = "0.2"

[lints.rust]
unsafe_code = "forbid"
