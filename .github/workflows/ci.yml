# One job per preflight profile; the logic lives in scripts/preflight.py (docs/project/ci.md).
# Under GitHub Actions preflight runs --strict: a check whose tool is missing fails the job.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/preflight.py docs-ci

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: python scripts/preflight.py rust-ci

  # The shipping platforms of ADR-0008: what differs by target, and the unsigned release package.
  platform:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: python scripts/preflight.py platform-ci

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          channel: stable
      # The committed Dart bindings are checked byte for byte against protoc's output (ADR-0004).
      - uses: arduino/setup-protoc@v3
        with:
          version: "36.2"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          dart pub global activate protoc_plugin 25.1.0
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - run: python scripts/preflight.py flutter-ci

  formal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - run: rustup show active-toolchain || rustup toolchain install
      # The Lean toolchain only. Mathlib's prebuilt files come from its own cache (`lake exe
      # cache get`); keeping them in the Actions cache too would take most of the repository's
      # quota to save about a minute.
      - uses: actions/cache@v6
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('formal/lean/lean-toolchain') }}
      - name: Install elan (Lean toolchain manager)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/v4.2.4/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      # The version the committed paper bodies were generated with; another version may render
      # them differently and fail `papers-current`.
      - name: Install Pandoc
        run: |
          curl -sSfL -o "$RUNNER_TEMP/pandoc.deb" https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-1-amd64.deb
          sudo dpkg -i "$RUNNER_TEMP/pandoc.deb"
      - name: Fetch the pinned Mathlib build
        working-directory: formal/lean
        run: lake exe cache get
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: formal/calibration
      - run: python scripts/preflight.py formal-ci
